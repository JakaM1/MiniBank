services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavite POSTGRES_PASSWORD v .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minibank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 5s
      retries: 10
volumes:
  minibank_data:
